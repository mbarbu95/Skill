<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Penetration Testing Quiz</title>
<style>body{font-family:Arial,Helvetica,sans-serif;margin:0;background:#f5f7fb;color:#1f2933}header{background:#16324f;color:white;padding:28px 48px}main{width:min(1120px,calc(100% - 28px));margin:24px auto 80px}.toolbar{position:sticky;top:0;background:#f5f7fb;padding:14px;border-bottom:1px solid #d8dee8;display:flex;justify-content:space-between}button{background:#2563eb;color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:700}.secondary{background:#475569}.question{background:white;border:1px solid #d8dee8;border-radius:8px;padding:16px;margin:12px 0}label{display:block;border:1px solid #d8dee8;border-radius:7px;padding:8px;margin:7px 0}.feedback{display:none;background:#f8fafc;border-left:4px solid #2563eb;margin-top:10px;padding:10px}.correct{border-color:#86efac}.incorrect{border-color:#fca5a5}h2{color:#16324f}</style></head><body><header><h1>Penetration Testing Concepts - Quiz</h1><p>50 questions: 40 single-answer and 10 select all that apply.</p></header><main><div class='toolbar'><b id='score'>Score: not graded</b><div><button onclick='gradeQuiz()'>Check answers</button> <button class='secondary' onclick='resetQuiz()'>Reset</button></div></div><div id='quiz'></div>
<script>const questions=[{"type": "single", "q": "What is a penetration test?", "o": ["A passive log review only", "An authorized intrusive test against a company network", "A backup process", "A patch installation method"], "a": [1]}, {"type": "single", "q": "Which test gives no information to the tester?", "o": ["White box", "Gray box", "Black box", "Credentialed scan"], "a": [2]}, {"type": "single", "q": "Which test gives limited information?", "o": ["Black box", "White box", "Bug bounty only", "Gray box"], "a": [3]}, {"type": "single", "q": "Which test may include access to source code?", "o": ["White box", "War driving", "Non-credentialed scan", "OSINT"], "a": [0]}, {"type": "single", "q": "What should be defined before a pen test starts?", "o": ["Only CVSS scores", "Only a drone flight path", "Rules of Engagement", "A public CVE ID"], "a": [2]}, {"type": "single", "q": "What does scope define?", "o": ["Only wallpaper settings", "Allowed test type and actions", "Only password length", "Only the lunch schedule"], "a": [1]}, {"type": "single", "q": "Why notify the IT team in an announced test?", "o": ["To disable all monitoring", "To avoid cleanup", "To remove all logs", "To identify pen tester IPs versus real attacks"], "a": [3]}, {"type": "single", "q": "What does data handling cover?", "o": ["How PII and sensitive data are stored and protected", "Only where chairs are placed", "Only firewall model numbers", "Only coffee breaks"], "a": [0]}, {"type": "single", "q": "Where should risky web application testing occur?", "o": ["Live production only", "Sandbox", "Unapproved third-party site", "User laptop only"], "a": [1]}, {"type": "single", "q": "What is cleanup?", "o": ["Deleting the final report", "Stopping all patching", "Restoring the environment to its original state", "Turning off monitoring"], "a": [2]}, {"type": "single", "q": "What is bug bounty?", "o": ["Blocking all external reports", "Rewarding testers who find vulnerabilities", "A type of firewall", "A CVSS rating"], "a": [1]}, {"type": "single", "q": "What is pivoting?", "o": ["Collecting OSINT only", "Running a non-intrusive scan", "Using a compromised host to attack another system", "Resetting a password"], "a": [2]}, {"type": "single", "q": "What is lateral movement?", "o": ["Mapping Wi-Fi from a car", "Rating vulnerabilities", "Writing source code", "Moving through the network to find more resources"], "a": [3]}, {"type": "single", "q": "What is persistence?", "o": ["Maintaining an attack over time", "A one-time patch", "A CVSS low score", "A cleanup step"], "a": [0]}, {"type": "single", "q": "What is escalation of privilege?", "o": ["Lowering account privileges", "Running a passive drone camera", "Gaining a higher privilege level by exploiting a weakness", "Creating a report title"], "a": [2]}, {"type": "single", "q": "Which is active reconnaissance?", "o": ["Overhearing a conversation unknowingly", "Calling the AD team to request a password reset using a found username", "Reading a public web page only", "Watching from a distance without action"], "a": [1]}, {"type": "single", "q": "Which is passive reconnaissance?", "o": ["Trying to exploit a server", "Calling help desk for reset", "Launching malware", "Listening to a security team conversation without their knowledge"], "a": [3]}, {"type": "single", "q": "What is war driving?", "o": ["Driving around mapping wireless access points", "Flying a drone to map Wi-Fi", "Scanning source code", "Judging red team results"], "a": [0]}, {"type": "single", "q": "What is OSINT?", "o": ["Encrypted private data theft", "Legally collected public-domain intelligence", "A hypervisor type", "A CVSS score"], "a": [1]}, {"type": "single", "q": "Which team mimics attackers?", "o": ["Blue team", "White team", "Red team", "Green team"], "a": [2]}, {"type": "single", "q": "Which team defends and mitigates?", "o": ["Red team", "Blue team", "Purple team only", "Bug bounty team"], "a": [1]}, {"type": "single", "q": "Which team sets ROE and judges exercises?", "o": ["Green team", "Red team", "White team", "OSINT team"], "a": [2]}, {"type": "single", "q": "Which team repairs vulnerabilities quickly?", "o": ["Red team", "White team", "War driving team", "Green team"], "a": [3]}, {"type": "single", "q": "Which team combines red and blue roles?", "o": ["Purple team", "White team", "Green team", "CVE team"], "a": [0]}, {"type": "single", "q": "What does a vulnerability scanner identify?", "o": ["Only successful phishing emails", "Only physical locks", "Weaknesses such as missing updates or account vulnerabilities", "Only training schedules"], "a": [2]}, {"type": "single", "q": "Why are zero-days hard for scanners?", "o": ["They always have CVE fixes", "They are not yet identified and have no patches", "They are always false positives", "They require no remediation"], "a": [1]}, {"type": "single", "q": "What is CVE?", "o": ["A score from 0.1 to 10.0 only", "A pen test team", "A drone type", "A list of known computer flaws with IDs"], "a": [3]}, {"type": "single", "q": "What is CVSS used for?", "o": ["Rating vulnerability severity", "Storing passwords", "Running a sandbox", "Replacing ROE"], "a": [0]}, {"type": "single", "q": "What should be handled first in CVSS output?", "o": ["Low events", "Critical events", "Unknown wallpaper issues", "Closed tickets"], "a": [1]}, {"type": "single", "q": "What is a false positive?", "o": ["Scanner misses a real vulnerability", "Scan agrees with manual inspection", "Scanner reports a vulnerability that is not actually present", "All vulnerabilities are exploited"], "a": [2]}, {"type": "single", "q": "What is a false negative?", "o": ["The scanner is correct", "A real vulnerability exists but the scanner misses it", "The scan finds only logs", "The team fixes all issues"], "a": [1]}, {"type": "single", "q": "What is a true positive?", "o": ["A vulnerability is missed", "A scan crashes", "Scan results agree with manual inspection", "A pen tester loses access"], "a": [2]}, {"type": "single", "q": "What should happen after a vulnerability scan?", "o": ["Delete all logs", "Stop patching", "Ignore critical findings", "Review log files and address potential vulnerabilities"], "a": [3]}, {"type": "single", "q": "What is a credentialed scan?", "o": ["A scan with higher privileges and more accurate information", "A scan with no permissions", "A physical-only inspection", "A drone scan"], "a": [0]}, {"type": "single", "q": "What can a credentialed scan check?", "o": ["Only public websites", "Only Wi-Fi names", "Documents, audit files, certificates, and account information", "Only desk labels"], "a": [2]}, {"type": "single", "q": "What is a non-credentialed scan?", "o": ["A scan with domain admin rights", "A lower-privilege scan showing what an attacker can easily find", "A white box pen test", "A bug bounty"], "a": [1]}, {"type": "single", "q": "Which vulnerabilities should be fixed first after a non-credentialed scan?", "o": ["Only hidden internal-only notes", "Only old reports", "None", "Those visible to an attacker"], "a": [3]}, {"type": "single", "q": "What is a non-intrusive scan?", "o": ["A passive scan that reports vulnerabilities without causing damage", "A scan that exploits every issue", "A pen test with source code", "A phishing campaign"], "a": [0]}, {"type": "single", "q": "What is an intrusive scan?", "o": ["A passive report only", "A scan that attempts exploitation and can cause damage", "A public social media search", "A CVE ID lookup only"], "a": [1]}, {"type": "single", "q": "How does a pen test differ from most vulnerability scans?", "o": ["It is always less intrusive", "It cannot cause damage", "It tries to fully exploit findings and is more intrusive", "It only reviews logs"], "a": [2]}, {"type": "multi", "q": "Select all that apply: Which items belong in Rules of Engagement?", "o": ["Random attacks outside authorization", "Client contact details", "Scope", "Data handling"], "a": [1, 2, 3]}, {"type": "multi", "q": "Select all that apply: Which are exploitation techniques?", "o": ["Persistence", "Pivoting", "Privilege escalation", "Lateral movement"], "a": [0, 1, 2, 3]}, {"type": "multi", "q": "Select all that apply: Which are reconnaissance tools or methods?", "o": ["War flying", "OSINT", "Drones", "War driving"], "a": [0, 1, 2, 3]}, {"type": "multi", "q": "Select all that apply: Which teams are exercise teams?", "o": ["Purple team", "Blue team", "White team", "Red team"], "a": [0, 1, 2, 3]}, {"type": "multi", "q": "Select all that apply: Which statements about CVSS are correct?", "o": ["It is built into many scanners", "Critical events should be handled first", "It indicates vulnerability severity", "It replaces cleanup"], "a": [0, 1, 2]}, {"type": "multi", "q": "Select all that apply: Which scan results are described?", "o": ["False negative", "True positive", "Purple positive", "False positive"], "a": [0, 1, 3]}, {"type": "multi", "q": "Select all that apply: What can credentialed scans provide?", "o": ["Account information", "More accurate information", "Certificate checks", "Document and audit file checks"], "a": [0, 1, 2, 3]}, {"type": "multi", "q": "Select all that apply: Which are scan types?", "o": ["Application scans", "Network scans", "Configuration review", "Web application scans"], "a": [0, 1, 2, 3]}, {"type": "multi", "q": "Select all that apply: Web application scans can look for:", "o": ["Website vulnerabilities", "Physical door locks", "SQL injection", "Cross-site scripting"], "a": [0, 2, 3]}, {"type": "multi", "q": "Select all that apply: Which statements are true?", "o": ["Non-credentialed scans have higher privileges than credentialed scans", "Intrusive scans should be sandboxed", "Pen tests can be intrusive", "Vulnerability scans are often informational"], "a": [1, 2, 3]}];const quiz=document.getElementById('quiz');function renderQuiz(){quiz.innerHTML='<h2>Questions 1-40: one correct answer</h2>';questions.forEach((item,idx)=>{if(idx===40)quiz.insertAdjacentHTML('beforeend','<h2>Questions 41-50: select all that apply</h2>');const t=item.type==='multi'?'checkbox':'radio';quiz.insertAdjacentHTML('beforeend',`<section class="question" id="q${idx}"><b>${idx+1}. ${item.q}</b>${item.o.map((o,i)=>`<label><input type="${t}" name="q${idx}" value="${i}"> ${o}</label>`).join('')}<div class="feedback"></div></section>`);})}function selected(i){return[...document.querySelectorAll(`input[name="q${i}"]:checked`)].map(x=>Number(x.value))}function same(a,b){return a.length===b.length&&a.every(v=>b.includes(v))}function gradeQuiz(){let c=0;questions.forEach((q,i)=>{const ok=same(selected(i).sort(),q.a.slice().sort());if(ok)c++;const e=document.getElementById('q'+i);e.classList.remove('correct','incorrect');e.classList.add(ok?'correct':'incorrect');const fb=e.querySelector('.feedback');fb.style.display='block';fb.innerHTML='<b>Correct answer: '+q.a.map(x=>String.fromCharCode(65+x)).join(', ')+'</b>';});document.getElementById('score').textContent=`Score: ${c} / ${questions.length} (${Math.round(c/questions.length*100)}%)`;scrollTo({top:0,behavior:'smooth'})}function resetQuiz(){document.querySelectorAll('input').forEach(i=>i.checked=false);document.querySelectorAll('.question').forEach(q=>{q.classList.remove('correct','incorrect');q.querySelector('.feedback').style.display='none'});document.getElementById('score').textContent='Score: not graded'}renderQuiz();</script></main></body></html>
